name: Deploy Lambda

on:
  push:
    branches:
      - main
    paths:
      - lambda/ses-bounce-slack-notifier/index.mjs
  workflow_dispatch:

concurrency:
  group: deploy-lambda-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Lambda function
        working-directory: lambda/ses-bounce-slack-notifier
        run: zip function.zip index.mjs

      - name: Update Lambda function code
        working-directory: lambda/ses-bounce-slack-notifier
        run: aws lambda update-function-code --function-name ses-bounce-slack-notifier --zip-file fileb://function.zip --region ${{ secrets.AWS_REGION }}

      - name: Wait for Lambda code update to complete
        run: |
          for i in $(seq 1 12); do
            STATE=$(aws lambda get-function-configuration \
              --function-name ses-bounce-slack-notifier \
              --region ${{ secrets.AWS_REGION }} \
              --query 'LastUpdateStatus' \
              --output text)
            echo "Update status: $STATE"
            if [ "$STATE" = "Successful" ]; then break; fi
            if [ "$STATE" = "Failed" ]; then echo "Lambda code update failed"; exit 1; fi
            sleep 5
          done

      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name ses-bounce-slack-notifier \
            --region ${{ secrets.AWS_REGION }} \
            --environment "Variables={SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}}"

      - name: Wait for Lambda configuration update to complete
        run: |
          for i in $(seq 1 12); do
            STATE=$(aws lambda get-function-configuration \
              --function-name ses-bounce-slack-notifier \
              --region ${{ secrets.AWS_REGION }} \
              --query 'LastUpdateStatus' \
              --output text)
            echo "Update status: $STATE"
            if [ "$STATE" = "Successful" ]; then exit 0; fi
            if [ "$STATE" = "Failed" ]; then echo "Lambda config update failed"; exit 1; fi
            sleep 5
          done
          echo "Timed out waiting for Lambda config update"; exit 1
