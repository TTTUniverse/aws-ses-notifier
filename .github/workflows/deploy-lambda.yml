name: Deploy Lambda

on:
  push:
    branches:
      - main
    paths:
      - lambda/ses-bounce-slack-notifier/index.mjs
  workflow_dispatch:

concurrency:
  group: deploy-lambda-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FUNCTION_NAME: ses-bounce-slack-notifier
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Lambda function
        working-directory: lambda/ses-bounce-slack-notifier
        run: zip function.zip index.mjs

      - name: Update Lambda code
        working-directory: lambda/ses-bounce-slack-notifier
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --zip-file fileb://function.zip \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Lambda to be ready
        run: |
          aws lambda wait function-updated-v2 \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --environment "Variables={SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}}"

      - name: Wait for Lambda to be ready
        run: |
          aws lambda wait function-updated-v2 \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}
