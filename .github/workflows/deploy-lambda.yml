name: Deploy Lambda

on:
  push:
    branches:
      - main
    paths:
      - lambda/ses-bounce-slack-notifier/index.mjs
  workflow_dispatch:

concurrency:
  group: deploy-lambda-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Lambda function
        working-directory: lambda/ses-bounce-slack-notifier
        run: zip function.zip index.mjs

      - name: Update Lambda function code
        working-directory: lambda/ses-bounce-slack-notifier
        run: aws lambda update-function-code --function-name ses-bounce-slack-notifier --zip-file fileb://function.zip --region ${{ secrets.AWS_REGION }}

      - name: Wait for Lambda update to complete
        working-directory: lambda/ses-bounce-slack-notifier
        run: aws lambda wait function-updated --function-name ses-bounce-slack-notifier --region ${{ secrets.AWS_REGION }}
