name: Deploy Lambda

on:
  push:
    branches:
      - main
    paths:
      - lambda/ses-bounce-slack-notifier/index.mjs
  workflow_dispatch:

concurrency:
  group: deploy-lambda-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FUNCTION_NAME: ses-bounce-slack-notifier
  RUNTIME: nodejs22.x
  HANDLER: index.handler
  MEMORY: 128
  TIMEOUT: 3
  ROLE_ARN: arn:aws:iam::183248602306:role/service-role/ses-bounce-slack-notifier-role-ezuv100o
  SNS_TOPIC_ARN: arn:aws:sns:us-east-1:183248602306:ses-reputation-alerts

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Lambda function
        working-directory: lambda/ses-bounce-slack-notifier
        run: zip function.zip index.mjs

      - name: Create or update Lambda function
        working-directory: lambda/ses-bounce-slack-notifier
        run: |
          if aws lambda get-function --function-name ${{ env.FUNCTION_NAME }} --region ${{ secrets.AWS_REGION }} > /dev/null 2>&1; then
            echo "Function exists — updating code"
            aws lambda update-function-code \
              --function-name ${{ env.FUNCTION_NAME }} \
              --zip-file fileb://function.zip \
              --region ${{ secrets.AWS_REGION }}
          else
            echo "Function not found — creating"
            FUNCTION_ARN=$(aws lambda create-function \
              --function-name ${{ env.FUNCTION_NAME }} \
              --runtime ${{ env.RUNTIME }} \
              --handler ${{ env.HANDLER }} \
              --memory-size ${{ env.MEMORY }} \
              --timeout ${{ env.TIMEOUT }} \
              --role ${{ env.ROLE_ARN }} \
              --zip-file fileb://function.zip \
              --region ${{ secrets.AWS_REGION }} \
              --query 'FunctionArn' \
              --output text)
            echo "Created function: $FUNCTION_ARN"
            echo "FUNCTION_ARN=$FUNCTION_ARN" >> $GITHUB_ENV
            echo "FUNCTION_CREATED=true" >> $GITHUB_ENV
          fi

      - name: Wait for Lambda to be ready
        run: |
          for i in $(seq 1 12); do
            STATE=$(aws lambda get-function \
              --function-name ${{ env.FUNCTION_NAME }} \
              --region ${{ secrets.AWS_REGION }} \
              --query 'Configuration.LastUpdateStatus' \
              --output text)
            echo "[$i/12] LastUpdateStatus: $STATE"
            [ "$STATE" = "Successful" ] && exit 0
            [ "$STATE" = "Failed" ]     && { echo "Lambda update failed"; exit 1; }
            sleep 5
          done
          echo "Timed out"; exit 1

      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ secrets.AWS_REGION }} \
            --environment "Variables={SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}}"

      - name: Wait for Lambda to be ready
        run: |
          for i in $(seq 1 12); do
            STATE=$(aws lambda get-function \
              --function-name ${{ env.FUNCTION_NAME }} \
              --region ${{ secrets.AWS_REGION }} \
              --query 'Configuration.LastUpdateStatus' \
              --output text)
            echo "[$i/12] LastUpdateStatus: $STATE"
            [ "$STATE" = "Successful" ] && exit 0
            [ "$STATE" = "Failed" ]     && { echo "Lambda update failed"; exit 1; }
            sleep 5
          done
          echo "Timed out"; exit 1

      - name: Ensure SNS trigger is configured
        run: |
          FUNCTION_ARN=$(aws lambda get-function \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ secrets.AWS_REGION }} \
            --query 'Configuration.FunctionArn' \
            --output text)

          # Add resource-based permission (idempotent — remove first if exists)
          aws lambda remove-permission \
            --function-name ${{ env.FUNCTION_NAME }} \
            --statement-id sns-invoke \
            --region ${{ secrets.AWS_REGION }} 2>/dev/null || true

          aws lambda add-permission \
            --function-name ${{ env.FUNCTION_NAME }} \
            --statement-id sns-invoke \
            --action lambda:InvokeFunction \
            --principal sns.amazonaws.com \
            --source-arn ${{ env.SNS_TOPIC_ARN }} \
            --region ${{ secrets.AWS_REGION }}

          # Subscribe SNS topic if not already subscribed
          EXISTING=$(aws sns list-subscriptions-by-topic \
            --topic-arn ${{ env.SNS_TOPIC_ARN }} \
            --region ${{ secrets.AWS_REGION }} \
            --query "Subscriptions[?Protocol=='lambda' && Endpoint=='$FUNCTION_ARN'].SubscriptionArn" \
            --output text)

          if [ -z "$EXISTING" ]; then
            echo "Adding SNS subscription"
            aws sns subscribe \
              --topic-arn ${{ env.SNS_TOPIC_ARN }} \
              --protocol lambda \
              --notification-endpoint $FUNCTION_ARN \
              --region ${{ secrets.AWS_REGION }}
          else
            echo "SNS subscription already exists: $EXISTING"
          fi
