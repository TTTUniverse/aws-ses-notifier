name: Deploy Lambda

on:
  push:
    branches:
      - main
    paths:
      - lambda/ses-bounce-slack-notifier/index.mjs
      - deploy/**
      - .github/workflows/deploy-lambda.yml
  workflow_dispatch:

concurrency:
  group: deploy-lambda-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FUNCTION_NAME: ses-bounce-slack-notifier
  SNS_TOPIC_NAME: ses-reputation-alerts
  LAMBDA_ROLE_NAME: ses-bounce-slack-notifier-role
  LOG_LEVEL: info

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare deploy configuration
        env:
          PROJECTS_CONFIG_JSON: ${{ secrets.PROJECTS_CONFIG }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          LAMBDA_ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
        run: |
          set -euo pipefail

          # AWS / Lambda settings (secrets override defaults from deploy/.env.example)
          export AWS_REGION="${{ secrets.AWS_REGION }}"
          export AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          export FUNCTION_NAME="${{ env.FUNCTION_NAME }}"
          export SNS_TOPIC_NAME="${{ env.SNS_TOPIC_NAME }}"
          export LAMBDA_ROLE_NAME="${{ env.LAMBDA_ROLE_NAME }}"
          export LOG_LEVEL="${{ env.LOG_LEVEL }}"
          export SLACK_WEBHOOK_URL="${SLACK_WEBHOOK_URL:-}"
          export SLACK_CHANNEL="${SLACK_CHANNEL:-}"
          export LAMBDA_ROLE_ARN="${LAMBDA_ROLE_ARN:-}"

          mkdir -p deploy/config

          if [[ -n "${PROJECTS_CONFIG_JSON}" ]]; then
            echo "Writing projects config from GitHub Secret PROJECTS_CONFIG"
            echo "${PROJECTS_CONFIG_JSON}" > deploy/config/projects.json
          elif [[ -f deploy/config/projects.json ]]; then
            echo "Using committed deploy/config/projects.json"
          elif [[ -f deploy/config/projects.example.json ]]; then
            echo "WARNING: Using projects.example.json — set PROJECTS_CONFIG secret for production"
            cp deploy/config/projects.example.json deploy/config/projects.json
          else
            echo "ERROR: No projects config found"
            exit 1
          fi

          jq empty deploy/config/projects.json
          echo "Projects configured: $(jq '.projects | length' deploy/config/projects.json)"

      - name: Run full deploy
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          FUNCTION_NAME: ${{ env.FUNCTION_NAME }}
          SNS_TOPIC_NAME: ${{ env.SNS_TOPIC_NAME }}
          LAMBDA_ROLE_NAME: ${{ env.LAMBDA_ROLE_NAME }}
          LOG_LEVEL: ${{ env.LOG_LEVEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          WEBHOOK_MAP: ${{ secrets.WEBHOOK_MAP }}
          LAMBDA_ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
          PROJECTS_CONFIG: deploy/config/projects.json
        run: |
          chmod +x deploy/scripts/*.sh deploy/scripts/lib/*.sh 2>/dev/null || true
          bash deploy/scripts/deploy.sh

      - name: Deployment summary
        if: success()
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          PROJECTS_CONFIG: deploy/config/projects.json
        run: |
          FUNCTION_ARN=$(aws lambda get-function \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ secrets.AWS_REGION }} \
            --query 'Configuration.FunctionArn' \
            --output text)

          LAST_MODIFIED=$(aws lambda get-function \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region ${{ secrets.AWS_REGION }} \
            --query 'Configuration.LastModified' \
            --output text)

          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lambda | \`${FUNCTION_ARN}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Last Modified | ${LAST_MODIFIED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SNS Topic | \`${{ env.SNS_TOPIC_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Projects | $(jq '.projects | length' deploy/config/projects.json) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Queues" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.projects[] | "- `\(.queueName)` → \(.projectLabel) → `\(.channel // "default")`"' \
            deploy/config/projects.json >> "$GITHUB_STEP_SUMMARY"
